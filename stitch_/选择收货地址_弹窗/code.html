<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Inter", "system-ui", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<title>选择收货地址 - LPG服务平台</title>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<!-- Backdrop Dimmer -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-0"></div>
<!-- Modal Container -->
<div class="relative z-10 w-full max-w-lg bg-white dark:bg-slate-900 rounded-xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
<!-- Header -->
<div class="px-6 py-4 border-b border-gray-100 dark:border-slate-800 flex items-center justify-between">
<h2 class="text-xl font-semibold text-gray-800 dark:text-white">选择收货地址</h2>
<button class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
<span class="material-icons">close</span>
</button>
</div>
<!-- Search Bar -->
<div class="px-6 py-4 bg-gray-50 dark:bg-slate-800/50">
<div class="relative">
<span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">search</span>
<input class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-700 border border-gray-200 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none text-sm transition-all dark:text-white dark:placeholder-gray-400" placeholder="搜索姓名 / 手机号 / 详细地址..." type="text"/>
</div>
</div>
<!-- Address List Scroll Area -->
<div class="flex-1 overflow-y-auto p-6 space-y-4">
<!-- Default Address Card (Selected) -->
<div class="relative group cursor-pointer border-2 border-primary bg-primary/5 dark:bg-primary/10 rounded-xl p-4 transition-all hover:shadow-md">
<div class="flex justify-between items-start mb-2">
<div class="flex items-center gap-3">
<span class="font-bold text-gray-900 dark:text-white text-lg">张建国</span>
<span class="text-gray-600 dark:text-gray-400 font-medium">138 **** 5678</span>
<span class="px-2 py-0.5 bg-primary text-white text-[10px] font-bold rounded uppercase tracking-wider">默认</span>
</div>
<button class="flex items-center gap-1 text-primary hover:underline text-sm font-medium">
<span class="material-icons text-sm">edit</span>
                        编辑
                    </button>
</div>
<div class="text-gray-600 dark:text-gray-300 text-sm leading-relaxed pr-8">
                    江苏省苏州市工业园区星湖街328号 创意产业园 A1栋 402室
                </div>
<div class="absolute right-4 bottom-4">
<span class="material-icons text-primary text-2xl">check_circle</span>
</div>
</div>
<!-- Regular Address Card 1 -->
<div class="relative group cursor-pointer border border-gray-200 dark:border-slate-700 hover:border-primary/50 bg-white dark:bg-slate-800 rounded-xl p-4 transition-all hover:shadow-md">
<div class="flex justify-between items-start mb-2">
<div class="flex items-center gap-3">
<span class="font-bold text-gray-900 dark:text-white text-lg">李华 (液化气站)</span>
<span class="text-gray-600 dark:text-gray-400 font-medium">135 **** 2233</span>
</div>
<button class="flex items-center gap-1 text-gray-400 hover:text-primary transition-colors text-sm font-medium">
<span class="material-icons text-sm">edit</span>
                        编辑
                    </button>
</div>
<div class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed">
                    上海市浦东新区张江高科技园区 郭守敬路498号 2号仓库旁
                </div>
</div>
<!-- Regular Address Card 2 -->
<div class="relative group cursor-pointer border border-gray-200 dark:border-slate-700 hover:border-primary/50 bg-white dark:bg-slate-800 rounded-xl p-4 transition-all hover:shadow-md">
<div class="flex justify-between items-start mb-2">
<div class="flex items-center gap-3">
<span class="font-bold text-gray-900 dark:text-white text-lg">王经理</span>
<span class="text-gray-600 dark:text-gray-400 font-medium">189 **** 0011</span>
</div>
<button class="flex items-center gap-1 text-gray-400 hover:text-primary transition-colors text-sm font-medium">
<span class="material-icons text-sm">edit</span>
                        编辑
                    </button>
</div>
<div class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed">
                    浙江省杭州市滨江区江虹路611号 华星现代产业园 3号厂房后侧
                </div>
</div>
<!-- Card with Tag -->
<div class="relative group cursor-pointer border border-gray-200 dark:border-slate-700 hover:border-primary/50 bg-white dark:bg-slate-800 rounded-xl p-4 transition-all hover:shadow-md">
<div class="flex justify-between items-start mb-2">
<div class="flex items-center gap-3">
<span class="font-bold text-gray-900 dark:text-white text-lg">陈女士</span>
<span class="text-gray-600 dark:text-gray-400 font-medium">150 **** 9988</span>
<span class="px-2 py-0.5 bg-gray-100 dark:bg-slate-700 text-gray-500 dark:text-gray-400 text-[10px] font-bold rounded uppercase">家</span>
</div>
<button class="flex items-center gap-1 text-gray-400 hover:text-primary transition-colors text-sm font-medium">
<span class="material-icons text-sm">edit</span>
                        编辑
                    </button>
</div>
<div class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed">
                    苏州市相城区元和街道 嘉元路888号 悦澜花园 12幢 1803室
                </div>
</div>
<!-- Map View Hint (Optional Context) -->
<div class="mt-4 rounded-xl overflow-hidden border border-gray-100 dark:border-slate-800 h-24 relative">

<div class="absolute inset-0 bg-primary/10 flex items-center justify-center">
<div class="bg-white/90 dark:bg-slate-900/90 px-3 py-1.5 rounded-full flex items-center gap-2 shadow-sm border border-primary/20">
<span class="material-icons text-primary text-sm">location_on</span>
<span class="text-xs font-medium text-gray-700 dark:text-gray-200">查看地图上的所有点</span>
</div>
</div>
</div>
</div>
<!-- Footer -->
<div class="p-6 border-t border-gray-100 dark:border-slate-800 bg-white dark:bg-slate-900">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-3.5 rounded-lg flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-lg shadow-primary/20">
<span class="material-icons">add</span>
                新增收货地址
            </button>
<p class="text-center text-xs text-gray-400 mt-4">
                当前共存有 4 个常用地址
            </p>
</div>
</div>
</body></html>
